
version: 2

models:
  - name: dim_campus
    description: "Campus"
    columns:
      - name: campus_id
        description: "Natural key from els.campus"
        data_tests:
          - unique
          - not_null
  - name: dim_course
    description: "Course"
    columns:
      - name: course_id
        description: "Natural key from els.course"
        data_tests:
          - unique
          - not_null
